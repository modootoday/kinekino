[package]
name = "kinekino-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kinekino-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }

[lints]
workspace = true
