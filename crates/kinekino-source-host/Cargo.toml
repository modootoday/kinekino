[package]
name = "kinekino-source-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
request = ["dep:url"]
worker-buffer = ["dep:bytes"]
metadata = ["request"]
parent-stream = ["metadata"]
parent-host = ["parent-stream", "dep:kinekino-process"]
parent-host-test-support = ["parent-host", "kinekino-process/test-support"]
http-worker = ["metadata", "worker-buffer", "dep:reqwest"]
worker-ipc = ["http-worker", "dep:kinekino-process", "dep:tokio"]

[dependencies]
kinekino-core.workspace = true
# `fixture`: the host keeps re-exporting the fake plugin bodies its e2e tests run.
kinekino-plugin-sdk = { workspace = true, features = ["fixture"] }
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "time"] }
reqwest = { workspace = true, optional = true, features = ["rustls-tls"] }

[dev-dependencies]
http = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
kinekino-process = { workspace = true, optional = true }


[lints]
workspace = true
