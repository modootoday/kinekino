[package]
name = "kinekino-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["cdp", "chrome-embed"]
cdp = ["dep:chromiumoxide", "dep:tokio", "dep:futures"]
# X11 reparenting helpers (Linux only; no-op elsewhere).
x11-embed = ["dep:x11rb"]
# Installed Chrome `--app` window embedded via X11, controlled over CDP (Linux fallback).
chrome-embed = ["cdp", "x11-embed"]
# Official CEF child window. Build: CEF_PATH=<cef dist>; run: KINEKINO_CEF_DIR=<cef dist>.
cef = ["dep:cef"]
# Windows-only wry/WebView2 adapter; unverified on Linux CI.
webview2 = ["dep:wry"]

[dependencies]
kinekino-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chromiumoxide = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = { workspace = true, optional = true }
cef = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
wry = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "demo_engine_cef"
required-features = ["cef"]

[[example]]
name = "demo_engine_chrome"
required-features = ["chrome-embed"]
