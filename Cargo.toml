[workspace]
members = ["xtask", "crates/kinekino-player", "crates/kinekino-cli", "crates/kinekino-host", "crates/kinekino-core", "crates/kinekino-platform", "crates/kinekino-platform-windows", "crates/kinekino-platform-unix", "crates/kinekino-ui-plugins", "crates/kinekino-media-contracts", "crates/kinekino-subtitles", "crates/kinekino-jobs", "crates/kinekino-process", "crates/kinekino-vad", "crates/kinekino-vad-executor", "crates/kinekino-vad-worker", "crates/kinekino-source-host", "crates/kinekino-card-render", "crates/kinekino-browser", "crates/kinekino-app", "crates/kinekino-settings-ui", "crates/kinekino-inference", "crates/kinekino-inference-hf", "crates/kinekino-inference-local", "crates/kinekino-plugin-sdk", "crates/kinekino-libmpv", "crates/kinekino-player-ui"]
default-members = ["crates/kinekino-player", "crates/kinekino-cli", "crates/kinekino-host", "crates/kinekino-host", "crates/kinekino-core", "crates/kinekino-platform", "crates/kinekino-platform-unix", "crates/kinekino-ui-plugins", "crates/kinekino-media-contracts", "crates/kinekino-subtitles", "crates/kinekino-jobs", "crates/kinekino-process", "crates/kinekino-vad", "crates/kinekino-vad-executor", "crates/kinekino-vad-worker", "crates/kinekino-browser", "crates/kinekino-app", "crates/kinekino-settings-ui", "crates/kinekino-inference", "crates/kinekino-inference-hf", "crates/kinekino-inference-local", "crates/kinekino-plugin-sdk", "crates/kinekino-libmpv", "crates/kinekino-player-ui"]
exclude = ["vendor/meari", "tools/boundary-observation", "tools/engine-lab", "tools/model-review-bundle", "tools/model-spike", "tools/spec-maintenance", "tools/validation", "tools/visual-review"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libloading = "0.8.9"
linebender_resource_handle = "0.1.1"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
# Settings window (kinekino-settings-ui): the versions meari-native pins.
winit = "=0.31.0-beta.3"
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
rfd = { version = "=0.17.2", default-features = false }
adblock = { version = "0.13.3", default-features = false }
anyhow = "1"
base64 = "=0.22.1"
bytes = "=1.12.1"
cef = { version = "=156.2.0", default-features = false }
chromiumoxide = { version = "0.9.1", default-features = false }
eframe = { version = "=0.36.2", default-features = false }
egui_extras = { version = "=0.36.2", default-features = false }
egui_taffy = "0.14"
futures = "0.3"
http = "=1.5.0"
image = { version = "0.25", default-features = false }
libc = "0.2"
meari = { path = "vendor/meari/crates/meari" }
meari-native = { path = "vendor/meari/crates/meari-native", default-features = false }
ort = { version = "=2.0.0-rc.14", default-features = false }
png = "=0.18.1"
reqwest = { version = "=0.12.28", default-features = false }
scraper = "=0.25.0"
time = "=0.3.55"
tokio = "=1.53.3"
ttf-parser = { version = "=0.25.1", default-features = false }
webview2-com = "0.39.1"
windows = "=0.62.2"
windows-core = "=0.100.0"
wry = "0.57.0"
raw-window-handle = { version = "0.6.2", features = ["std"] }
x11rb = "0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctor = "0.10.1"
sha2 = "=0.10.9"
url = "2"
kinekino-app = { path = "crates/kinekino-app" }
kinekino-host = { path = "crates/kinekino-host" }
kinekino-browser = { path = "crates/kinekino-browser" }
kinekino-card-render = { path = "crates/kinekino-card-render" }
kinekino-core = { path = "crates/kinekino-core" }
kinekino-plugin-sdk = { path = "crates/kinekino-plugin-sdk" }
kinekino-libmpv = { path = "crates/kinekino-libmpv" }
kinekino-jobs = { path = "crates/kinekino-jobs" }
kinekino-media-contracts = { path = "crates/kinekino-media-contracts" }
kinekino-platform-unix = { path = "crates/kinekino-platform-unix" }
kinekino-platform-windows = { path = "crates/kinekino-platform-windows" }
kinekino-platform = { path = "crates/kinekino-platform" }
kinekino-settings-ui = { path = "crates/kinekino-settings-ui" }
kinekino-player-ui = { path = "crates/kinekino-player-ui" }
kinekino-player = { path = "crates/kinekino-player" }
kinekino-process = { path = "crates/kinekino-process" }
kinekino-source-host = { path = "crates/kinekino-source-host" }
kinekino-subtitles = { path = "crates/kinekino-subtitles" }
kinekino-ui-plugins = { path = "crates/kinekino-ui-plugins" }
kinekino-vad-executor = { path = "crates/kinekino-vad-executor" }
kinekino-vad-worker = { path = "crates/kinekino-vad-worker" }
kinekino-inference = { path = "crates/kinekino-inference" }
kinekino-inference-hf = { path = "crates/kinekino-inference-hf" }
kinekino-inference-local = { path = "crates/kinekino-inference-local" }
kinekino-vad = { path = "crates/kinekino-vad" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"


# Build-cache budget (guide:kinekino/build-cache): workspace code keeps line tables for
# backtraces; dependencies carry no debuginfo. Most of target/ was DWARF.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


[patch.crates-io]
blitz-paint = { path = "vendor/meari/crates/meari-paint" }
blitz-dom = { path = "vendor/meari/crates/meari-dom" }

