# Weekly grouped updates; reviewed and merged by hand like any change (ADR 0010).
# Label and Conventional Commits prefix per the shared automation rules (C5.4). Updates past
# a pinned (=) or major version get the needs-human label from a person (C7.3).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # windows-core must stay on the generation the windows crate and webview2-com use.
      # windows-core 0.100 has no matching windows release (newest windows is 0.62.x, which
      # needs windows-core ^0.62), and mixing the two breaks the Windows build. Bump these
      # three together once windows and webview2-com move to the same generation.
      - dependency-name: windows-core
        versions: [">= 0.63"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
