# Weekly grouped updates; reviewed and merged by hand like any change (ADR 0010).
# Label and Conventional Commits prefix per the shared automation rules (C5.4). Updates past
# a pinned (=) or major version get the needs-human label from a person (C7.3).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Seoul
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
