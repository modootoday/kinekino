name: Release

# A v<version> tag builds the binaries into a draft release and marks it published. As in
# specfold, a GitHub environment exists only per package registry, named after it, and gates
# the job that publishes there; kinekino publishes to no registry yet, so no job has an
# environment (ADR 0010). By hand (dry-run) it builds and packages everything, then deletes
# its draft. Signing and installers are planned and need secrets first (.github/RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (nothing kept)
        type: choice
        options: [dry-run]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
  CARGO_TERM_COLOR: never
  CARGO_TARGET_DIR: target
  CARGO_BUILD_JOBS: "4"

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        run: |
          version="$(bash .github/scripts/workspace-version.sh)"
          tag="v$version"
          if [ "$MODE" = dry-run ]; then tag="dry-run-$GITHUB_RUN_ID"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: test "v${{ steps.tag.outputs.version }}" = "$GITHUB_REF_NAME"
      - name: Release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          range="${previous:+$previous..}HEAD"
          git log "$range" --no-merges --format='- %s' > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Draft release
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; reusing it"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  binaries:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        # Linux builds on ubuntu-22.04 so the binaries need only glibc 2.35.
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # No rust-cache on release builds: a tag build starts clean (cache-poisoning hygiene).
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - shell: bash
        run: mkdir -p runtime/build-cache/tmp
      - shell: bash
        run: cargo build --locked --release -p kinekino-cli -p kinekino-app --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: bash .github/scripts/package.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release" dist
      - name: Upload
        shell: bash
        run: |
          tag="${{ needs.draft.outputs.tag }}"
          for f in dist/kinekino-*; do
            case "$f" in *.sha256) continue;; esac
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$(basename "$f")"; then
              echo "skip: $(basename "$f") is already on $tag"
            else
              gh release upload "$tag" "$f" "$f.sha256"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  finish:
    needs: [draft, binaries]
    if: always() && needs.draft.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Mark the release published
        if: env.MODE == 'publish' && needs.binaries.result == 'success'
        run: gh release edit "${{ needs.draft.outputs.tag }}" --draft=false --title "${{ needs.draft.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Remove the rehearsal draft
        if: env.MODE == 'dry-run'
        run: gh release delete "${{ needs.draft.outputs.tag }}" --yes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
