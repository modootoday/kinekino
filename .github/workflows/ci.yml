name: CI

# Runs on every pull request to main, after each merge to main (keeps the main build cache
# that pull requests restore) and by hand (ADR 0010, amended by the PR gate ADR).
# Jobs: lint (fmt, clippy, lint-structure, spec check), private term scan, Windows compile gate,
# tests on Linux and macOS, and the docs/ Jekyll build when the site exists.
# Linux (lint, deny-terms, test, site) is the pass/fail gate and always runs on a pull request or push;
# on a manual run it follows the `linux` input. Windows and macOS are advisory:
# off on pull requests and pushes, chosen per manual run, and continue-on-error so they never fail the run.
# Pull request and push runs have no inputs, so a bare `if: inputs.linux` would skip the gate
# and a skipped required check counts as passed; the Linux jobs test the event name first.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux:
        description: Linux gate (lint, tests, site)
        type: boolean
        default: true
      windows:
        description: Windows compile check (advisory)
        type: boolean
        default: false
      macos:
        description: macOS tests (advisory)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; runs on main finish so each merge saves the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml pins jobs=1 and a shared ../.cargo-target for the dev box.
  # Runners get their own in-repo target (rust-cache saves it) and all cores.
  CARGO_TARGET_DIR: target
  CARGO_BUILD_JOBS: "4"
  SPECFOLD_VERSION: v0.5.1

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p runtime/build-cache/tmp
      # The Meari text stack (fontique) links fontconfig on Linux.
      - name: Install fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask lint-structure
      - name: Install specfold (checksum-verified release)
        run: bash .github/scripts/install-specfold.sh "$SPECFOLD_VERSION" "$RUNNER_TEMP/specfold"
      - name: spec check
        run: KINEKINO_SPEC_BIN="$RUNNER_TEMP/specfold/spec" cargo xtask spec-check

  deny-terms:
    # Private term scan of what the change adds (adr:kinekino/20261116065239). Fail-closed:
    # no term list (unset secret, fork pull request) fails the check. Logs never show a term.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Scan commit messages, added lines and file names
        env:
          KINEKINO_DENY_TERMS: ${{ secrets.KINEKINO_DENY_TERMS }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: cargo xtask deny-terms --range "$BASE..$HEAD"

  windows-gate:
    # Compile check only; Windows tests run in the last phase (P8). Advisory.
    if: inputs.windows
    continue-on-error: true
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - shell: bash
        run: mkdir -p runtime/build-cache/tmp
      - name: clippy (Windows gate crates)
        shell: bash
        run: bash .github/scripts/windows-gate.sh

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    strategy:
      fail-fast: false
      matrix:
        # 26.04: playback needs mpv/libmpv 0.38 or later (24.04 ships 0.37).
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p runtime/build-cache/tmp
      # Playback tests need mpv, libmpv and ffmpeg and fail (never skip) without them.
      # Runner-only system packages; nothing is bundled or committed (mpv-install guide).
      - name: Install mpv, libmpv and ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install mpv ffmpeg
            echo "KINEKINO_LIBMPV=$(brew --prefix mpv)/lib/libmpv.2.dylib" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv libmpv2 ffmpeg xvfb libfontconfig1-dev
          fi
      # Pinned Noto faces (verified download, never committed); UI tests render with them.
      - run: cargo run --locked -p kinekino-cli --bin kinekino -- fonts fetch
      - run: cargo test --workspace --locked --no-fail-fast

  test-macos:
    # Advisory: same steps as test; a failure is reported but does not fail the run.
    if: inputs.macos
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p runtime/build-cache/tmp
      # Playback tests need mpv, libmpv and ffmpeg and fail (never skip) without them.
      # Runner-only system packages; nothing is bundled or committed (mpv-install guide).
      - name: Install mpv, libmpv and ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install mpv ffmpeg
            echo "KINEKINO_LIBMPV=$(brew --prefix mpv)/lib/libmpv.2.dylib" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv libmpv2 ffmpeg xvfb libfontconfig1-dev
          fi
      # Pinned Noto faces (verified download, never committed); UI tests render with them.
      - run: cargo run --locked -p kinekino-cli --bin kinekino -- fonts fetch
      - run: cargo test --workspace --locked --no-fail-fast

  site:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    # Pages serves main:/docs with the github-pages gem (as specfold); this only proves it builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: has
        run: if [ -f docs/Gemfile ]; then echo "site=true" >> "$GITHUB_OUTPUT"; else echo "no docs/Gemfile; skipped" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: steps.has.outputs.site == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: jekyll build
        if: steps.has.outputs.site == 'true'
        working-directory: docs
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site"
