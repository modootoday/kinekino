name: Public surface

# Shared required check `Public surface` (shared automation rules C4; adr:kinekino/20261116065239).
# Scans what a change will land: commit messages, added lines and file names in the range,
# and the pull request title and body. Also rejects Co-authored-by trailers whose address is
# not @users.noreply.github.com in commits from the cutoff on (earlier history is not rewritten).
# Fail-closed: without the KINEKINO_DENY_TERMS secret (unset, or a fork pull request) it fails.
# Logs name the place and the term's list number, never the term.
# Separate from ci.yml so that editing a pull request's title or body re-runs only this check.
# No paths filter (it owns a required check) and no pull_request_target.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-surface-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_BUILD_JOBS: "4"
  # Co-authored-by rule applies to commits made at or after this time.
  COAUTHOR_SINCE: "2026-11-16T06:55:00Z"

jobs:
  public-surface:
    name: Public surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Scan the change and the pull request text
        env:
          KINEKINO_DENY_TERMS: ${{ secrets.KINEKINO_DENY_TERMS }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          cargo xtask deny-terms --range "$BASE..$HEAD"
          --text-env PR_TITLE --text-env PR_BODY
          --coauthor-since "$COAUTHOR_SINCE"
